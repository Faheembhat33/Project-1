services:
#---------------
#DATABASE SERVICE
#_-----------------
  db:
    image: mysql:8.0
    container_name: sonicwave-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sonicwave
      MYSQL_USER: sonicwave_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sonicwave_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sonicwave_root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
#---------------
#BACKEND SERVICE
  backend:
    build: ./backend
    container_name: sonicwave-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-this-development-secret}
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DB_NAME: sonicwave
      DB_USER: sonicwave_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-sonicwave_dev_password}
      DB_HOST: db
      DB_PORT: "3306"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
#---------------
#FRONTEND SERVICE
  frontend:
    build: ./frontend
    container_name: sonicwave-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  media_data:
